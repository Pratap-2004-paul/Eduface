<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — SmartAttend</title>
  <link rel="stylesheet" href="/static/auth.css"/>
  <style>
    body.admin-login-body {
      background: radial-gradient(
        ellipse at top left,
        #2b0d0d 0%,
        #0f0f1a 60%
      );
    }

    .admin-card {
      border-color: #5c1a1a;
    }

    .admin-card .auth-logo h1 {
      color: #e05260;
    }

    .admin-card .form-group input:focus {
      border-color: #e05260;
      box-shadow: 0 0 0 3px rgba(224,82,96,0.15);
    }

    .admin-card .btn-auth {
      background: linear-gradient(135deg, #e05260, #c0404e);
    }

    .admin-card .btn-auth:hover {
      background: linear-gradient(135deg, #c0404e, #a03040);
    }

    .admin-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(224,82,96,0.1);
      border: 1px solid rgba(224,82,96,0.3);
      color: #e05260;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 20px;
      font-family: 'Segoe UI', sans-serif;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #555;
      text-decoration: none;
      font-size: 0.82rem;
      margin-bottom: 20px;
      transition: color 0.2s;
      font-family: 'Segoe UI', sans-serif;
    }

    .back-link:hover { color: #888; }
  </style>
</head>
<body class="auth-body admin-login-body">

  <a href="/login" class="back-link">← Back to role selection</a>

  <div class="auth-card admin-card">

    <div class="auth-logo">
      <span class="icon">🔐</span>
      <h1>Admin Login</h1>
      <div class="admin-badge">
        🛡 Administrator Access
      </div>
    </div>

    {% if error %}
    <div class="alert alert-error">⚠️ {{ error }}</div>
    {% endif %}

    {% if success %}
    <div class="alert alert-success">✅ {{ success }}</div>
    {% endif %}

    <form method="POST" action="/login/admin">

      <div class="form-group">
        <label>Admin Email</label>
        <input
          type="email"
          name="email"
          placeholder="admin@attendance.com"
          required
          value="{{ prefill_email or '' }}"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="password-wrap">
          <input
            type="password"
            name="password"
            id="admin-password"
            placeholder="Enter admin password"
            required
            autocomplete="current-password"
          />
          <button type="button"
                  class="eye-toggle"
                  onclick="togglePwd('admin-password', this)"
                  tabindex="-1">👁</button>
        </div>
      </div>

      <button type="submit" class="btn-auth">
        Sign In as Admin
      </button>

    </form>

    <div class="divider"><span>default credentials</span></div>

    <div style="background:#2b0d0d;border:1px solid #5c1a1a;
                border-radius:8px;padding:12px 16px;
                font-size:0.8rem;color:#888;
                font-family:'Segoe UI',sans-serif;">
      📧 admin@attendance.com<br/>
      🔑 admin123
      <span style="color:#444;font-size:.72rem;display:block;
                   margin-top:6px;">
        Change these after first login
      </span>
    </div>

  </div>

  <script>
  function togglePwd(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === "password") {
      input.type  = "text";
      btn.textContent = "🙈";
      btn.title   = "Hide password";
    } else {
      input.type  = "password";
      btn.textContent = "👁";
      btn.title   = "Show password";
    }
  }
</script>

</body>
</html>
